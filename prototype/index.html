<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Hardcover Bookery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: storefront with a quiet white ground, one teal accent, book covers as the only loud color.
   Admin views swap the header for a sidebar shell. */
:root{
  --bg:#ffffff; --surface:#F5F6F7; --surface2:#ECEEF0; --ink:#0D100C; --muted:#5A626D; --line:#E2E5E9;
  --accent:#A8EC7A; --accent-deep:#2F7A3B; --accent-ink:#0C1A08; --accent-wash:#F0FBE8;
  --grad-soft:linear-gradient(135deg,#F6FFEE 0%,#E3F9CF 52%,#FFFFFF 100%);
  --grad-glow:radial-gradient(60% 70% at 18% 20%,rgba(168,236,122,.5),transparent 70%);
  --hot:#D43F22; --ok:#1B8A4B; --warn:#9A6200; --bad:#C2352B;
  --shadow:0 2px 4px rgba(12,26,8,.05),0 16px 36px rgba(12,26,8,.09);
  --ease:cubic-bezier(.33,1,.68,1);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
body{background:var(--bg);background-image:linear-gradient(180deg,#F4FEEA 0,#FFFFFF 460px);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.015em;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bg-surface{background:var(--surface)} .bg-surface2{background:var(--surface2)}
.line{border:1px solid var(--line)} .line-b{border-bottom:1px solid var(--line)} .line-t{border-top:1px solid var(--line)} .line-r{border-right:1px solid var(--line)}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;border:1px solid var(--line);background:var(--bg);transition:background .15s,border-color .15s,transform .28s var(--ease),box-shadow .28s}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)} .btn-dark:hover{background:var(--ink);filter:brightness(1.15)}
.btn-sm{padding:.45rem .85rem;font-size:13px;border-radius:999px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit}
.select{appearance:auto}
.field{display:flex;flex-direction:column;gap:.3rem} .field label{font-size:12px;font-weight:600;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .55rem;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-warn{color:var(--warn)} .p-ok{color:var(--ok)} .p-bad{color:var(--bad)} .p-acc{color:var(--accent-deep)} .p-mut{color:var(--muted)}
.chip{padding:.4rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.protobar{background:var(--ink);color:var(--bg);font-size:12.5px}
.protobar .seg button{padding:.25rem .7rem;border-radius:6px;border:0;background:transparent;color:inherit;opacity:.7;font-weight:600}
.protobar .seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);opacity:1}
.announce{background:var(--ink);color:#fff;font-size:12.5px;letter-spacing:.03em;text-align:center;padding:.45rem 16px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.04em;display:flex;align-items:baseline;gap:.35rem;text-decoration:none}
.logo small{font-family:var(--f-mono);font-weight:500;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep)}
.nav a,.nav button{padding:.4rem .2rem;font-weight:500;font-size:14.5px;text-decoration:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink)}
.nav [aria-current="page"]{border-bottom-color:var(--accent)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* covers */
.cw{container-type:inline-size}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;background:var(--cb);color:var(--cf);padding:9cqw 10cqw 9cqw 13cqw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.14)}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:6cqw;background:rgba(0,0,0,.18)}
.cover .ca{font-size:5.6cqw;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.9}
.cover .ct{font-family:var(--f-display);font-weight:700;font-size:13cqw;line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.cover .cp{font-size:5cqw;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.cover svg{width:46cqw;height:46cqw;align-self:center;margin-block:auto}
.cover.obj .ct{font-size:9.5cqw}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:52px 32px}
.pcard .cover,.dcover .cover{transition:transform .38s var(--ease),box-shadow .38s}
.pcard:hover,.pcard:focus-visible{position:relative;z-index:2}
.pcard:hover .cover,.pcard:focus-visible .cover{transform:scale(1.08);box-shadow:0 20px 38px rgba(12,26,8,.22),0 2px 6px rgba(0,0,0,.16)}
.dcover:hover .cover{transform:scale(1.03);box-shadow:0 24px 44px rgba(12,26,8,.22)}
.pcard .ptitle{font-size:1.05rem}
.pdesc{font-size:14px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-band{background:linear-gradient(180deg,#F3FDE9 0%,#FFFFFF 100%);position:relative;overflow:hidden}
.hero-band>*{position:relative;z-index:1}
.mark{background:linear-gradient(transparent 60%,var(--accent) 60%);padding-inline:.1em}
.mood-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mood{text-align:left;padding:22px;border-radius:16px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:.4rem;min-height:160px;transition:transform .25s,box-shadow .25s}
.mood:hover{border-color:var(--ink);background:var(--surface)}
.mood b{font-family:var(--f-display);font-size:1.2rem;line-height:1.2;font-weight:700}
.mood span{color:var(--muted);font-size:14px}
.mood em{margin-top:auto;font-style:normal;font-weight:600;color:var(--accent-deep);font-size:14px}
.band{background:linear-gradient(135deg,#0A0E09 0%,#13200E 60%,#26441A 100%);color:#fff;border-radius:20px;padding:clamp(24px,5vw,52px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px;align-items:center;position:relative;overflow:hidden}
.band>*{position:relative;z-index:1}
.band h2{color:#fff}
.band .tip{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid rgba(255,255,255,.14);color:#E6EFE0}
.band .tip i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.pace-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px}
.pace-box input[type=range]{width:100%;accent-color:#A8EC7A;margin-top:.8rem}
.club{background:var(--surface);border-radius:20px;padding:clamp(24px,5vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center}
.pcard{display:flex;flex-direction:column;gap:.55rem;text-align:left;background:none;border:0;padding:0}
.pcard:hover .ptitle{text-decoration:underline}
.badge{position:absolute;top:10px;right:10px;z-index:2;background:var(--ink);color:var(--accent);font-size:11.5px;font-weight:700;padding:.2rem .6rem;border-radius:999px}
.badge.out{background:var(--surface2);color:var(--muted)}
.old{text-decoration:line-through;color:var(--muted);font-size:13px}
.drawer-ov{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:.6rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.7rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.side a,.side button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.55rem .75rem;border-radius:9px;border:0;background:none;font-weight:500;font-size:14.5px;text-decoration:none}
.side a:hover,.side button:hover{background:var(--surface)}
.side [aria-current="page"]{background:var(--accent-wash);color:var(--accent-deep);font-weight:600}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--line);transition:.15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.step{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:14px;color:var(--muted)}
.step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:12.5px}
.step[aria-current="step"]{color:var(--ink)} .step[aria-current="step"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done i{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl{display:flex;gap:0;margin-block:.5rem}
.tl div{flex:1;font-size:12px;color:var(--muted);text-align:center;position:relative;padding-top:18px}
.tl div::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}
.tl div::after{content:"";position:absolute;top:0;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl div.on{color:var(--ink);font-weight:600} .tl div.on::before{background:var(--accent)} .tl div.on::after{background:var(--accent);border-color:var(--accent)}
.hero-title{font-size:clamp(2.5rem,6.4vw,4.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.02}
.hdr-row{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"search logo icons";align-items:center;gap:12px;padding-block:14px 6px}
.hdr-search{grid-area:search;max-width:260px;position:relative;transition:max-width .5s var(--ease)}
.hdr-row .logo{grid-area:logo}
.hdr-icons{grid-area:icons;display:flex;justify-content:flex-end;gap:.4rem}
.hdr-nav{display:flex;justify-content:center;gap:1.7rem;padding-bottom:10px}
@media (max-width:700px){.hdr-row{grid-template-columns:1fr auto;grid-template-areas:"logo icons" "search search"}.hdr-search{max-width:none}.hdr-nav{justify-content:flex-start;gap:1.2rem;overflow-x:auto}}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:28px;padding-bottom:14px;flex-wrap:wrap;position:relative}
.tlink{background:none;border:0;padding:0;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px}
.tlink:hover{color:var(--accent-deep)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding-block:30px;border-block:1px solid var(--line)}
.trust div{display:flex;flex-direction:column;align-items:center;gap:.55rem;text-align:center;font-size:14px;font-weight:500}
.trust svg{color:var(--accent-deep)}
.hdr .wrap{position:relative}
.has-mega{display:inline-block}
.mega{display:grid;position:absolute;left:16px;right:16px;top:100%;z-index:35;background:var(--bg);border:1px solid var(--line);border-radius:0 0 22px 22px;box-shadow:var(--shadow);padding:26px 30px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .28s var(--ease),transform .4s var(--ease),visibility 0s .4s}
.mega>div{opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .45s var(--ease)}
@media (min-width:701px){.has-mega:hover .mega,.has-mega:focus-within .mega{opacity:1;visibility:visible;transform:none;transition-delay:0s}
 .has-mega:hover .mega>div,.has-mega:focus-within .mega>div{opacity:1;transform:none}
 .has-mega:hover .mega>div:nth-child(2),.has-mega:focus-within .mega>div:nth-child(2){transition-delay:.06s}
 .has-mega:hover .mega>div:nth-child(3),.has-mega:focus-within .mega>div:nth-child(3){transition-delay:.12s}
 .hdr-search:focus-within{max-width:440px}}
@media (max-width:700px){.mega{display:none}}
.mega .label{margin-bottom:.5rem}
.mega button{display:block;padding:.3rem 0;border:0;background:none;text-align:left;font-size:14.5px;font-weight:500}
.mega button:hover{color:var(--accent-deep);text-decoration:underline;text-underline-offset:4px}
.carousel{display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 14px 30px;margin:-26px -14px -30px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .pcard{flex:0 0 min(345px,78vw);scroll-snap-align:start}
.sec-actions{display:flex;align-items:center;gap:1.1rem}
.arr{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:17px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.arr:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rank{font-family:var(--f-display);font-size:2.7rem;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.4px var(--ink);margin-bottom:.15rem}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:26px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px}
.steps .n{font-family:var(--f-display);font-size:clamp(3.4rem,7vw,5.2rem);font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.6px var(--ink)}
.steps h3{font-size:1.5rem;font-weight:700;margin-top:.6rem}
.rv{will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.xp-p{transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.play .pgrid .pcard,#results.play .pcard{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
.dot{width:9px;height:9px;border-radius:99px;border:1px solid var(--ink);background:transparent;padding:0;transition:width .3s,background .3s}
.dot.on{width:26px;background:var(--ink)}
.rot{display:inline-block}
/* expanding genre panels */
.xp{display:flex;flex-direction:column;gap:10px}
.xp-p{position:relative;height:88px;border-radius:22px;border:1px solid var(--line);background:var(--pbg);color:var(--pfg);padding:22px;overflow:hidden;text-align:left;transition:height .5s var(--ease)}
.xp-p.open{height:500px}
.xp-num{font-family:var(--f-mono);font-size:12px;opacity:.65}
.xp-t{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-weight:700;font-size:1.2rem;transition:opacity .25s;padding-left:34px}
.xp-more{position:absolute;inset:0;padding:22px 26px;display:flex;flex-direction:column;gap:.7rem;opacity:0;pointer-events:none;transition:opacity .35s .12s}
.xp-more h3{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-.03em;max-width:15ch}
.xp-more p{max-width:34ch;opacity:.85;font-size:15px}
.xp-more em{font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.xp-covers{display:flex;gap:12px;margin-top:auto}
.xp-covers .cw{width:134px}
.xp-p.open .xp-more{opacity:1}
.xp-p.open .xp-t{opacity:0}
@media (min-width:701px){
  .xp{flex-direction:row;height:530px}
  .xp-p{height:auto;flex:1 1 0;min-width:0;transition:flex .6s var(--ease)}
  .xp-p.open{height:auto}
  .xp-t{left:22px;top:auto;bottom:22px;transform:rotate(180deg);writing-mode:vertical-rl;padding-left:0}
  .xp:not(:hover) .xp-p.open,.xp-p:hover,.xp-p:focus-visible{flex:4.2}
  .xp:hover .xp-p.open:not(:hover){flex:1}
  .xp-p:hover .xp-more,.xp-p:focus-visible .xp-more{opacity:1}
  .xp:hover .xp-p.open:not(:hover) .xp-more{opacity:0}
  .xp-p:hover .xp-t,.xp-p:focus-visible .xp-t{opacity:0}
  .xp:hover .xp-p.open:not(:hover) .xp-t{opacity:1}
}
/* bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:245px;gap:16px}
.tile{position:relative;text-align:left;border:0;border-radius:22px;background:var(--cb);color:var(--cf);padding:20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s}
.tile:hover{transform:scale(1.025);box-shadow:var(--shadow);z-index:2}
.tile svg{width:62px;height:62px;align-self:flex-end;opacity:.95;transition:transform .45s var(--ease)}
.tile:hover svg{transform:scale(1.18) rotate(-6deg)}
.tile .tl-c{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.8}
.tile .tl-t{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15}
.tile .tl-p{font-size:14px;opacity:.9;margin-top:.2rem}
.tile.big{grid-column:span 2;grid-row:span 2;padding:28px}
.tile.big svg{width:150px;height:150px}
.tile.big .tl-t{font-size:2rem;letter-spacing:-.02em;max-width:12ch}
@media (max-width:700px){.bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:205px}.tile.big{grid-column:span 2;grid-row:span 1}.tile.big svg{width:90px;height:90px}}
/* filters */
.seg2{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface);border-radius:999px}
.seg2 button{padding:.5rem 1rem;border-radius:999px;border:0;background:transparent;font-weight:600;font-size:13.5px;display:flex;gap:.45rem;align-items:center;transition:background .2s,color .2s}
.seg2 button:hover{background:var(--surface2)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cnt{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips-row{display:flex;gap:.5rem;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{display:inline-flex;gap:.45rem;align-items:center;transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-2px)}
.fpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.fpanel.open{grid-template-rows:1fr}
.fpanel>div{overflow:hidden;min-height:0}

function totals(){
  const L = S.cart.map(l => ({p:P(l.id), qty:l.qty}));
  const sub = L.reduce((a,l) => a + price(l.p) * l.qty, 0);
  const g = L.reduce((a,l) => a + l.p.w * l.qty, 0);
  const extra = Math.max(0, Math.ceil(g / 500) - 1) * SET.perHalf;
  const std = !sub ? 0 : (sub >= SET.free ? 0 : SET.base + extra);
  const exp = !sub ? 0 : Math.round((SET.base + extra) * 1.8 * 100) / 100 + 4;
  const opts = {standard:std, express:exp, pickup:0};
  const ship = opts[S.ship];
  const total = sub + ship;
  return {L, sub, g, opts, ship, total, tax: total / (1 + SET.igv/100) * (SET.igv/100)};
}

   <div class="card" style="margin-top:16px;padding:18px"><h3 style="font-weight:700;font-size:1.1rem">Pedidos recientes</h3><div class="scroll-x">${ordersTable(orders.slice(0, 4), false)}</div></div>`;
}
function ordersTable(rows, edit){
  return `<table class="tbl"><thead><tr><th>Código</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Pago</th><th>Estado</th></tr></thead><tbody>${rows.map(o => {
    const open = !!S.rows[o.code];
    const code = edit ? `<button class="tlink ${open ? 'on' : ''}" style="text-decoration:none;font-family:var(--f-mono);font-size:14px" data-a="drow" data-code="${o.code}" aria-expanded="${open}" aria-label="Ver detalle de ${o.code}"><span class="chev">›</span> ${o.code}</button>` : o.code;
    return `<tr><td class="mono">${code}</td><td>${esc(o.user)}</td><td>${o.date}</td><td class="num">${money(orderSub(o) + o.ship)}</td><td>${payPill(o.pay)}</td><td>${edit ? `<label style="position:absolute;left:-9999px" for="s-${o.code}">Estado de ${o.code}</label><select id="s-${o.code}" class="select" style="width:auto;padding:.3rem .5rem" data-c="ostatus" data-code="${o.code}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>` : statusPill(o.status)}</td></tr>` +
      (edit ? `<tr class="drow ${open ? 'open' : ''}" id="dr-${o.code}"><td colspan="6" style="padding:0"><div class="dr"><div><div class="dr-in">${orderDetail(o)}</div></div></div></td></tr>` : '');
  }).join('')}</tbody></table>`;
}
function adminPedidos(){
  const rows = orders.filter(o => S.ordFilter === 'all' || o.status === S.ordFilter);
  return `<div style="display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap"><div><h1 style="font-size:2rem;font-weight:600">Pedidos</h1><p class="muted">Cambia el estado desde la tabla. El cliente lo ve en su cuenta.</p></div>
   <div class="field" style="flex-direction:row;align-items:center;gap:.5rem"><label for="of">Filtrar</label><select id="of" class="select" style="width:auto" data-c="ofilter"><option value="all">Todos los estados</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${S.ordFilter === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div></div>
   <div class="card scroll-x" style="margin-top:18px">${rows.length ? ordersTable(rows, true) : '<p class="muted" style="padding:28px;text-align:center">No hay pedidos con ese estado.</p>'}</div>`;
}
function adminInv(){
  return `<h1 style="font-size:2rem;font-weight:600">Inventario</h1><p class="muted">Edita el stock físico. Las filas en rojo están agotadas y las naranjas tienen 5 unidades o menos.</p>
   <div class="card scroll-x" style="margin-top:18px"><table class="tbl"><thead><tr><th>Producto</th><th>Tipo</th><th>SKU</th><th>Precio</th><th>Peso</th><th>Stock</th></tr></thead><tbody>${products.map(p => `<tr><td style="min-width:200px"><b>${esc(p.title)}</b>${p.type === 'libro' ? `<br><span class="muted" style="font-size:12.5px">${esc(p.author)}</span>` : ''}</td><td>${TYPES[p.type]}</td><td class="mono">HB-${String(p.id).padStart(4, '0')}</td><td class="num">${money(price(p))}</td><td class="num">${p.w} g</td>
    <td><label style="position:absolute;left:-9999px" for="st-${p.id}">Stock de ${esc(p.title)}</label><input id="st-${p.id}" class="input num" type="number" min="0" style="width:84px;padding:.35rem .5rem;${p.stock === 0 ? 'border-color:var(--bad);color:var(--bad)' : p.stock <= 5 ? 'border-color:var(--warn);color:var(--warn)' : ''}" value="${p.stock}" data-c="stock" data-id="${p.id}"></td></tr>`).join('')}</tbody></table></div>`;
}
function adminUsers(){
  return `<h1 style="font-size:2rem;font-weight:600">Usuarios y roles</h1><p class="muted">Solo el super administrador gestiona quién puede vender y quién administra el sitio.</p>
   <div class="card scroll-x" style="margin-top:18px"><table class="tbl"><thead><tr><th>Nombre</th><th>Correo</th><th>Último acceso</th><th>Rol</th></tr></thead><tbody>${users.map((u, i) => `<tr><td><b>${esc(u.name)}</b></td><td class="muted">${esc(u.email)}</td><td>${u.last}</td><td><label style="position:absolute;left:-9999px" for="ru-${i}">Rol de ${esc(u.name)}</label><select id="ru-${i}" class="select" style="width:auto;padding:.3rem .5rem" data-c="urole" data-i="${i}">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
   <h2 style="font-size:1.3rem;font-weight:700;margin-top:32px">Qué puede hacer cada rol</h2>
   <div class="card scroll-x" style="margin-top:12px"><table class="tbl"><thead><tr><th>Acción</th><th>Cliente</th><th>Administrador</th><th>Super admin</th></tr></thead><tbody>${[['Comprar, ver sus pedidos y direcciones',1,1,1],['Ver y cambiar el estado de los pedidos',0,1,1],['Crear y editar productos y stock',0,1,1],['Ver reportes de ventas',0,1,1],['Gestionar usuarios y roles',0,0,1],['Configurar pasarelas de pago y tarifas de envío',0,0,1],['Ver el registro de actividad',0,0,1]].map(([a, ...c]) => `<tr><td>${a}</td>${c.map(v => `<td>${v ? '<b style="color:var(--ok)">Sí</b>' : '<span class="muted">No</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function adminAjustes(){
  const sw = (k, t, d) => `<label class="line-b" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0"><span><b>${t}</b><br><span class="muted" style="font-size:13px">${d}</span></span><span class="switch"><input type="checkbox" data-c="set" data-k="${k}" ${SET[k] ? 'checked' : ''}><span></span></span></label>`;
  const num = (k, t, u) => `<div class="field"><label for="n-${k}">${t}</label><div style="display:flex;align-items:center;gap:.5rem"><input id="n-${k}" class="input num" type="number" min="0" step="0.5" value="${SET[k]}" data-c="setn" data-k="${k}"><span class="muted">${u}</span></div></div>`;
  return `<h1 style="font-size:2rem;font-weight:600">Pasarelas y envíos</h1><p class="muted">Lo que cambies aquí se refleja de inmediato en el checkout de la tienda.</p>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:18px;align-items:start">
   <div class="card" style="padding:6px 18px"><h3 style="font-weight:700;padding-top:.8rem">Medios de pago</h3>${sw('stripe','Tarjeta (Stripe)','Débito y crédito')}${sw('mp','Mercado Pago','Billetera y cuotas')}${sw('bank','Transferencia bancaria','Confirmación manual')}<div style="height:.4rem"></div></div>
   <div class="card" style="padding:18px;display:grid;gap:14px"><h3 style="font-weight:700">Tarifas</h3>${num('free','Envío gratis desde','soles')}${num('base','Tarifa base de envío (hasta 500 g)','soles')}${num('perHalf','Adicional por cada 500 g','soles')}${num('igv','IGV','%')}</div></div>`;
}
function adminLog(){
  return `<h1 style="font-size:2rem;font-weight:600">Actividad</h1><p class="muted">Quién hizo qué en el panel.</p><div class="card" style="margin-top:18px">${LOG.map(([t, u, a]) => `<div class="line-b" style="display:grid;grid-template-columns:76px minmax(0,150px) 1fr;gap:12px;padding:.8rem 16px;font-size:14px"><span class="mono muted">${t}</span><b>${u}</b><span style="min-width:0">${a}</span></div>`).join('')}</div>`;
}

/* ---------- enrutado y render ---------- */
function view(){
  const r = S.route;
  if (r.startsWith('admin')) {
    if (S.role === 'cliente') return {store:true, html: denied('Esta zona es solo para el equipo de Hardcover. Entra con una cuenta de administrador.')};
    const isSuper = NAV.find(n => n[0] === r)?.[2] === 'super';
    if (isSuper && S.role !== 'super') return {admin:true, html: adminShell(denied('Esta sección es solo para el super administrador.'))};
    const m = {'admin-resumen':adminResumen,'admin-pedidos':adminPedidos,'admin-inventario':adminInv,'admin-usuarios':adminUsers,'admin-ajustes':adminAjustes,'admin-actividad':adminLog};
    return {admin:true, html: adminShell((m[r] || adminResumen)())};
  }
  if (r.startsWith('producto-')) return {store:true, html: detail(+r.split('-')[1])};
  const m = {
    inicio: home, catalogo: () => catalog(), carrito: cartPage, checkout, gracias: thanks, cuenta: account,
    novedades: () => listing('Novedades', p => p.isNew, 'Lo último que llegó a la librería.'),
    masvendidos: () => listing('Más vendidos', p => p.best, 'Los que más salen este mes.'),
    regalos: () => listing('Papelería y regalos', p => p.type !== 'libro', 'Separadores, llaveros, figuras y más.'),
  };
  return {store:true, html: (m[r] || notFound)()};
}
function render(){
  S.rvOn = S.play;
  const v = view(), app = $('#app');
  app.innerHTML = protobar() + (S.route === 'inicio' && !v.admin ? coverHero() : '') + (v.admin ? '' : header()) + v.html + (v.admin ? '' : footer()) + (S.drawer && !v.admin ? drawerHtml() : '') + (S.qv && !v.admin ? qvHtml() : '');
  S.qvEnter = false; S.drEnter = false;
  app.className = S.play ? 'play' : '';
  if (S.rvOn) reveal();
  coverTick();
  S.play = false;
}
function go(r){
  S.route = r; S.drawer = false; S.qv = null; S.play = true;
  if (r === 'checkout') S.step = Math.max(1, S.step);
  if (r.startsWith('producto-')) S.qty = 1;
  try { history.replaceState(null, '', '#' + r); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function toast(msg){
  S.toast = msg; $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { $('#toast-root').innerHTML = ''; }, 1900);
}
function addToCart(id, qty){
  const p = P(id), l = S.cart.find(x => x.id === id), have = l ? l.qty : 0;
  if (!p.stock) return toast('Sin stock por ahora');
  const n = Math.min(p.stock, have + qty);
  if (l) l.qty = n; else S.cart.push({id, qty: n});
  if (n === p.stock && have + qty > p.stock) toast('Solo quedan ' + p.stock + ' unidades'); else toast('Añadido: ' + p.title);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'FORM') return;
  const a = el.dataset.a, v = el.dataset.v, id = +el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  if (['ftype','fcat','clr','frate','reset'].includes(a)) S.play = true;
  switch (a) {
    case 'qv': S.qv = id; S.qty = 1; S.qvEnter = true; S.qvAcc = {sin:true}; render(); return;
    case 'qvx': S.qv = null; render(); return;
    case 'qvadd': addToCart(id, S.qty); S.qv = null; S.drawer = true; S.drEnter = true; render(); return;
    case 'qvacc': { S.qvAcc[v] = !S.qvAcc[v]; const bx = document.getElementById('acc-' + v); if (bx) { bx.classList.toggle('open', !!S.qvAcc[v]); el.setAttribute('aria-expanded', !!S.qvAcc[v]); } return; }
    case 'enter': { const c = document.getElementById('cover'); window.scrollTo({top: c ? c.offsetHeight : 600, behavior: 'smooth'}); return; }
    case 'hero': S.hero = +v; updateHero(); return;
    case 'xp': if (window.matchMedia && window.matchMedia('(min-width:701px)').matches) { S.f.type = 'libro'; S.f.cat = v; go('catalogo'); } else { S.xp = +el.dataset.i; render(); } return;
    case 'fopen': { S.fopen = !S.fopen; const pn = document.getElementById('fpanel'); if (pn) pn.classList.toggle('open', S.fopen); el.setAttribute('aria-expanded', S.fopen); el.textContent = S.fopen ? 'Menos filtros ▴' : 'Más filtros ▾'; return; }
    case 'frate': S.f.rate = +v; render(); return;
    case 'clr': { const d = {type:'all', cat:'all', max:150, sale:false, stock:false, rate:0, q:''}; S.f[v] = d[v]; render(); return; }
    case 'go': go(v); return;
    case 'role': S.role = v; if (v === 'cliente' && S.route.startsWith('admin')) S.route = 'inicio'; if (v !== 'cliente' && !S.route.startsWith('admin')) S.route = 'admin-resumen'; if (v === 'admin' && ['admin-usuarios','admin-ajustes','admin-actividad'].includes(S.route)) S.route = 'admin-resumen'; S.drawer = false; go(S.route); return;
    case 'drawer': S.drawer = !S.drawer; S.drEnter = S.drawer; render(); return;
    case 'add': addToCart(id, el.dataset.detail ? S.qty : 1); render(); if (!el.dataset.detail) { S.drawer = true; S.drEnter = true; render(); } return;
    case 'inc': { const l = S.cart.find(x => x.id === id); if (l && l.qty < P(id).stock) l.qty++; else toast('No hay más stock'); render(); return; }
    case 'dec': { const l = S.cart.find(x => x.id === id); if (l && l.qty > 1) l.qty--; render(); return; }
    case 'rm': S.cart = S.cart.filter(x => x.id !== id); render(); return;
    case 'q+': S.qty = Math.min(P(S.qv || +S.route.split('-')[1]).stock || 1, S.qty + 1); render(); return;
    case 'q-': S.qty = Math.max(1, S.qty - 1); render(); return;
    case 'ftype': S.f.type = v; if (v !== 'libro' && v !== 'all') S.f.cat = 'all'; render(); return;
    case 'fcat': S.f.cat = S.f.cat === v ? 'all' : v; render(); return;
    case 'cat': S.f.type = 'libro'; S.f.cat = v; go('catalogo'); return;
    case 'scroll': { const c = document.getElementById(el.dataset.t); if (c) c.scrollBy({left: +v * 520, behavior: 'smooth'}); return; }
    case 'typego': S.f = {type:v,cat:'all',max:150,sale:false,stock:false,rate:0,q:'',sort:'rel'}; go('catalogo'); return;
    case 'ofertas': S.f = {type:'all',cat:'all',max:150,sale:true,stock:false,rate:0,q:'',sort:'rel'}; go('catalogo'); return;
    case 'reset': S.f = {type:'all',cat:'all',max:150,sale:false,stock:false,rate:0,q:'',sort:'rel'}; render(); return;
    case 'step': { S.stepView = S.step; S.step = +v; render(); requestAnimationFrame(() => requestAnimationFrame(() => { S.stepView = null; paintSteps(); })); return; }
    case 'place': {
      const t = totals(), n = String(43 + orders.filter(o => o.date === '07 oct').length - 2).padStart(4, '0');
      const o = {code:'HB-261007-' + n, user:S.form.name, date:'07 oct', items:t.L.map(l => [l.p.id, l.qty]), status: S.pay === 'bank' ? 'pending' : 'confirmed', pay: S.pay === 'bank' ? 'pending' : 'completed', via:{card:'Tarjeta',mp:'Mercado Pago',bank:'Transferencia'}[S.pay], ship:t.ship, method:{standard:'Estándar',express:'Express',pickup:'Recojo'}[S.ship]};
      t.L.forEach(l => l.p.stock = Math.max(0, l.p.stock - l.qty));
      orders.unshift(o); S.last = o; S.cart = []; S.step = 1; go('gracias'); return;
    }
    case 'atab': S.aTab = v; render(); return;
    case 'oo': { document.querySelectorAll('.ord.open').forEach(x => { if (x.id !== 'ord-' + v) x.classList.remove('open'); }); const t = document.getElementById('ord-' + v); if (t) { const o = t.classList.toggle('open'); S.openOrder = o ? v : null; el.setAttribute('aria-expanded', o); } return; }
    case 'drow': { const tr = document.getElementById('dr-' + el.dataset.code); if (tr) { const o = tr.classList.toggle('open'); S.rows[el.dataset.code] = o; el.classList.toggle('on', o); el.setAttribute('aria-expanded', o); } return; }
    case 'acc': { const bx = el.closest('.acc'); if (bx) { const o = bx.classList.toggle('open'); el.setAttribute('aria-expanded', o); } return; }
  }
});
document.addEventListener('submit', e => {
  const a = e.target.dataset.a; if (!a) return; e.preventDefault();
  if (a === 'club') { e.target.reset(); toast('Listo, ya estás en el club'); return; }
  if (a === 'search') { S.f.type = 'all'; S.f.cat = 'all'; go('catalogo'); }
  if (a === 'track') { const c = e.target.querySelector('input').value.trim().toUpperCase(), o = orders.find(x => x.code === c); if (o) { S.form.name = o.user; S.aTab = 'pedidos'; S.openOrder = o.code; go('cuenta'); } else toast('No encontramos ese código'); }
});
document.addEventListener('input', e => {
  const c = e.target.dataset.c;
  if (c === 'q') { S.f.q = e.target.value; if (S.route !== 'catalogo') { S.route = 'catalogo'; render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else { $('#results').classList.add('play'); $('#results').innerHTML = results(); const ac = $('#achips'); if (ac) ac.innerHTML = achipsHtml(); } }
  if (c === 'pace') { S.pace = +e.target.value; $('#pace-min').textContent = S.pace; $('#pace-out').textContent = paceBooks(S.pace); }
  if (c === 'fmax') { S.f.max = +e.target.value; $('#maxv').textContent = money(S.f.max); $('#hist').innerHTML = histHtml(); $('#achips').innerHTML = achipsHtml(); $('#results').classList.add('play'); $('#results').innerHTML = results(); }
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.c; if (!c) return;
  if (c === 'form') { S.form[t.dataset.k] = t.value; if (t.tagName === 'SELECT') render(); }
  else if (c === 'fsale') { S.f.sale = t.checked; S.play = true; render(); }
  else if (c === 'fstock') { S.f.stock = t.checked; S.play = true; render(); }
  else if (c === 'fsort') { S.f.sort = t.value; S.play = true; render(); }
  else if (c === 'ship') { S.ship = t.value; render(); }
  else if (c === 'pay') { S.pay = t.value; render(); }
  else if (c === 'ostatus') { const o = orders.find(x => x.code === t.dataset.code); o.status = t.value; if (t.value === 'cancelled') o.pay = o.pay === 'completed' ? 'refunded' : 'failed'; if (t.value === 'refunded') o.pay = 'refunded'; LOG.unshift(['ahora', S.role === 'super' ? 'Erick Gamarra' : 'Valeria Torres', 'Cambió el pedido ' + o.code + ' a ' + STATUS[t.value][0]]); render(); toast('Pedido actualizado'); }
  else if (c === 'ofilter') { S.ordFilter = t.value; render(); }
  else if (c === 'stock') { const p = P(+t.dataset.id); p.stock = Math.max(0, +t.value || 0); LOG.unshift(['ahora', S.role === 'super' ? 'Erick Gamarra' : 'Valeria Torres', 'Ajustó el stock de «' + p.title + '» a ' + p.stock]); render(); toast('Stock guardado'); }
  else if (c === 'urole') { users[+t.dataset.i].role = t.value; LOG.unshift(['ahora', 'Erick Gamarra', 'Cambió el rol de ' + users[+t.dataset.i].name + ' a ' + ROLES[t.value]]); toast('Rol actualizado'); }
  else if (c === 'set') { SET[t.dataset.k] = t.checked; toast('Ajuste guardado'); }
  else if (c === 'setn') { SET[t.dataset.k] = Math.max(0, +t.value || 0); toast('Ajuste guardado'); }
});
(function boot(){
  let h = ''; try { h = location.hash.slice(1); } catch (e) {}
  if (h) S.route = h;
  render();
  if (window.addEventListener) { window.addEventListener('scroll', rvKick, {passive:true}); window.addEventListener('scroll', () => requestAnimationFrame(coverTick), {passive:true}); window.addEventListener('resize', coverTick); window.addEventListener('resize', rvKick); initDrag(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.qv || S.drawer)) { S.qv = null; S.drawer = false; render(); } });
  setInterval(() => { if (S.route === 'inicio' && !document.hidden) { S.hero++; updateHero(); } }, 4600);
})();
</script>
